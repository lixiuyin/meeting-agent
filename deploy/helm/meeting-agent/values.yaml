# Default values for meeting-agent.
#
# L-6: Security defaults review:
# - Services use ClusterIP (internal-only). Avoid changing to NodePort or
#   LoadBalancer — use the ingress controller for external access instead.
# - Secrets must be supplied via `--set-string` or an override file that is
#   NEVER committed to git. Set createSecret=false when secretName references
#   a pre-existing Secret managed outside this release.
# - Enable TLS on the ingress for production deployments.
# - Enable NetworkPolicy in multi-tenant clusters to restrict pod-to-pod traffic.
# - The chart intentionally has no HPA/PDB surface. The SQLite + local Chroma
#   architecture is single-instance, and an availability policy for one pod
#   would either be misleading or block routine maintenance.

backend:
  image:
    repository: ghcr.io/lixiuyin/meeting-agent-backend
    tag: ""  # Empty uses Chart.appVersion; pin explicitly for reproducible rollbacks
    digest: ""  # Preferred for production: sha256:<64 hex>; overrides tag
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  livenessProbe:
    httpGet:
      path: /api/v1/health/live
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/v1/health/ready
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  service:
    port: 8000
  # Pod-level security context (applies to all containers in the pod).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  # Container-level security context (applies to the backend container).
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    ENVIRONMENT: production
    CORS_ORIGINS: https://meeting-agent.example.com
    TRUSTED_HOSTS: meeting-agent.example.com
  secretName: meeting-agent-secrets
  createSecret: false
  # Sensitive env vars — supply as plain strings via --set-string or an
  # overrides file (never commit). Kubernetes performs the base64 encoding.
  secrets: {}
  #  API_KEY: <plain string>
  #  PRINCIPAL_PEPPER: <plain string>
  #  LLM_API_KEY: <plain string>
  #  ASSEMBLYAI_API_KEY: <plain string>
  #  MARKER_API_KEY: <plain string>
  #  MINERU_API_KEY: <plain string>
  #  PADDLEOCR_API_KEY: <plain string>
  #  PROMETHEUS_API_KEY: <plain string>  # Separate key for /metrics scraper access
  #  FRONTEND_AUTH_USER: <basic-auth username>
  #  FRONTEND_AUTH_PASSWORD_HASH: <openssl passwd -apr1 output>
  # ExternalSecrets references — inject secrets from an external provider
  # (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, etc.) via
  # the External Secrets Operator.  Each entry maps to an envFrom secretRef.
  extraEnvFromSecret: []
  # Example:
  # extraEnvFromSecret:
  #   - meeting-agent-llm-keys      # ExternalSecret with LLM_API_KEY, etc.
  #   - meeting-agent-asr-keys      # ExternalSecret with ASSEMBLYAI_API_KEY

frontend:
  image:
    repository: ghcr.io/lixiuyin/meeting-agent-frontend
    tag: ""  # Empty uses Chart.appVersion; pin explicitly for reproducible rollbacks
    digest: ""  # Preferred for production: sha256:<64 hex>; overrides tag
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 8080
  # Pod-level security context (applies to all containers in the pod).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # Container-level security context (applies to the frontend container).
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "210"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "210"
  hosts:
    - host: meeting-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # TLS is required in production. Set `tlsDisabled: true` only for
  # local testing behind a terminating proxy that handles TLS.
  tlsDisabled: false
  # Example TLS configuration:
  # tls:
  #   - hosts:
  #       - meeting-agent.example.com
  #     secretName: meeting-agent-tls

networkPolicy:
  enabled: true
  ingress:
    from: []
    # Empty permits only pods in this release namespace. Add the ingress
    # controller namespace/pod selectors when it runs in another namespace.
    # from:
    #   - namespaceSelector:
    #       matchLabels:
    #         name: ingress-nginx
    #   - podSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: ingress-nginx
  egress: []
  # egress:
  #   - to:
  #       - ipBlock:
  #           cidr: 0.0.0.0/0
  #     ports:
  #       - protocol: TCP
  #         port: 443

persistence:
  enabled: true
  size: 10Gi
  # storageClassName must be set explicitly for your cluster.
  # An empty string uses the cluster's default StorageClass.
  storageClassName: ""

resources: {}
