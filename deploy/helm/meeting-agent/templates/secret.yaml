{{- /*
  Secret template — create an opaque Secret whose keys map 1:1 to the
  backend's env-var expectations.  Users must supply real values via
  `helm install --set backend.secrets.API_KEY=xxx ...` or a
  values-overrides file that is never committed to git.
*/ -}}
{{- if .Values.backend.createSecret }}
{{- $secretName := required "backend.secretName is required when backend.createSecret=true" .Values.backend.secretName -}}
{{- $secrets := required "backend.secrets must be non-empty when backend.createSecret=true" .Values.backend.secrets -}}
{{- range $key := list "API_KEY" "PRINCIPAL_PEPPER" "FRONTEND_AUTH_USER" "FRONTEND_AUTH_PASSWORD_HASH" -}}
{{- if not (get $secrets $key) -}}
{{- fail (printf "backend.secrets.%s is required and must be non-empty when backend.createSecret=true" $key) -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "meeting-agent.labels" . | nindent 4 }}
    component: backend
type: Opaque
stringData:
  {{- toYaml $secrets | nindent 2 }}
{{- end }}
