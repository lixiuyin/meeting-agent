{{- /*
  Secret template — create an opaque Secret whose keys map 1:1 to the
  backend's env-var expectations.  Users must supply real values via
  `helm install --set backend.secrets.API_KEY=xxx ...` or a
  values-overrides file that is never committed to git.
*/ -}}
{{- if .Values.backend.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "meeting-agent.labels" . | nindent 4 }}
    component: backend
type: Opaque
{{- with .Values.backend.secrets }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
