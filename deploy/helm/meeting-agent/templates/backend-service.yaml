apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-agent.fullname" . }}-backend
  labels:
    {{- include "meeting-agent.labels" . | nindent 4 }}
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
  selector:
    {{- include "meeting-agent.selectorLabels" . | nindent 4 }}
    component: backend
