server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-meeting-agent-style-nonce' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Gzip compression (dynamic)
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Brotli is unavailable in the upstream nginx:alpine image; gzip_static
    # above already serves pre-compressed .gz files for the largest wins.

    # Static assets with long-term caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Always fetch latest HTML entry to avoid stale chunk manifest after deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires -1;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_set_header X-API-Key "${BACKEND_API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 500M;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
