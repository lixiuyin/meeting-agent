map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic ${FRONTEND_AUTH_MODE};
    auth_basic_user_file /tmp/meeting-agent.htpasswd;

    # Gzip compression (dynamic)
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Brotli is unavailable in the upstream nginx:alpine image; gzip_static
    # above already serves pre-compressed .gz files for the largest wins.

    # Static assets with long-term caching
    location /assets/ {
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Always fetch latest HTML entry to avoid stale chunk manifest after deploy
    location = /index.html {
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires -1;
    }

    # Large request bodies are accepted only by the upload endpoint.  Keeping
    # the general JSON API small limits accidental/malicious parser pressure.
    location = /api/v1/meetings/upload {
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header X-API-Key "${API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_connect_timeout 10s;
        client_max_body_size 500M;
    }

    # API proxy
    location /api/ {
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_set_header X-API-Key "${API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_connect_timeout 10s;
        client_max_body_size 2M;
    }

    location = /healthz {
        auth_basic off;
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/meeting-agent-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
