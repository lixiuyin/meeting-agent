name: Nightly Quality

# Disabled: nightly mutation testing + benchmark + full-stack e2e are
# inherently flaky and depend on optional secrets (LLM_API_KEY,
# ASSEMBLYAI_API_KEY) that are not always provisioned. Re-enable by
# restoring the schedule trigger when the supporting infrastructure
# is ready.
"on":
  workflow_dispatch:

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker compose -f docker-compose.yaml up -d --build
      - run: ./scripts/wait-for-health.sh
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test e2e/full-stack
      - if: failure()
        run: docker compose logs > logs.txt
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-logs
          path: logs.txt
      - if: always()
        run: docker compose -f docker-compose.yaml down -v

  backend-mutmut:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run mutmut (targeted)
        run: |
          uv run mutmut run --paths-to-mutate \
            src/services/chain/_steps_session.py \
            src/services/chain/_extraction.py \
            src/services/rag/_retriever.py \
            src/services/rag/_bm25.py \
            src/services/memory/_service/_crud.py

  frontend-stryker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run stryker
        run: npm run mutation

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --dev
      - run: cd backend && uv run python -m scripts.benchmark all --iterations 5 --baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: backend/benchmark-results
