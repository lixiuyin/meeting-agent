name: Weekly Quality

"on":
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  LLM_API_KEY: ${{ secrets.QUALITY_LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.QUALITY_LLM_BASE_URL }}
  LLM_MODEL: ${{ vars.QUALITY_LLM_MODEL }}
  EMBEDDING_API_KEY: ${{ secrets.QUALITY_EMBEDDING_API_KEY }}
  EMBEDDING_BASE_URL: ${{ vars.QUALITY_EMBEDDING_BASE_URL }}
  EMBEDDING_MODEL: ${{ vars.QUALITY_EMBEDDING_MODEL }}

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate provider configuration without exposing values
        shell: bash
        run: |
          for name in LLM_API_KEY LLM_BASE_URL LLM_MODEL EMBEDDING_API_KEY EMBEDDING_BASE_URL EMBEDDING_MODEL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required quality configuration: $name" >&2
              exit 2
            fi
          done
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: cd backend && uv sync --dev
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: ./scripts/run-isolated-e2e-smoke.sh e2e/full-stack
        env:
          E2E_METRICS_OUTPUT: ${{ github.workspace }}/e2e-smoke.json
          E2E_ENVIRONMENT: production
          E2E_API_KEY: e2e-test-key-primary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-smoke-report
          path: e2e-smoke.json

  backend-mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run mutmut (targeted)
        run: uv run mutmut run --max-children 2

  frontend-stryker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run stryker
        run: npm run mutation

  benchmark:
    needs: e2e-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-smoke-report
          path: backend/benchmark-input
      - run: >-
          cd backend && uv run python -m scripts.benchmark all
          --iterations 5 --baseline
          --baseline-commands rag-retrieval rag-answer memory multi-turn process
          --process-report benchmark-input/e2e-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: backend/benchmark-results
