groups:
  - name: meeting-agent-slo
    rules:
      - alert: ChatLatencyP95High
        expr: max(histogram_quantile(0.95, sum by (le, endpoint) (rate(chat_completion_duration_seconds_bucket{endpoint=~"/api/v1/chat(/stream)?"}[5m])))) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat endpoint latency P95 above 3s"
          description: "The full chat response latency has been above the 3-second P95 objective for 15 minutes."

      - alert: ChatAvailabilityLow
        expr: sum(rate(chat_completion_total{outcome!="success"}[30m])) / sum(rate(chat_completion_total[30m])) > 0.005
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Chat availability below 99.5%"
          description: "Includes HTTP failures, terminal SSE errors, and incomplete responses."

      - record: meeting_agent:chat_availability:30d
        expr: 1 - ((sum(increase(chat_completion_total{outcome!="success"}[30d])) or (0 * sum(increase(chat_completion_total[30d])))) / sum(increase(chat_completion_total[30d])))

      - record: meeting_agent:chat_p95_seconds:30d
        expr: max(histogram_quantile(0.95, sum by (le, endpoint) (increase(chat_completion_duration_seconds_bucket{endpoint=~"/api/v1/chat(/stream)?"}[30d]))))

      - alert: ErrorRateHigh
        expr: rate(http_request_duration_seconds_count{status=~"5.."}[5m]) / rate(http_request_duration_seconds_count[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 5%"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: CircuitBreakerOpen
        expr: traffic_controller_breaker_state == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM circuit breaker is open"
          description: "The traffic controller circuit breaker is open. LLM requests are being rejected."

      - alert: DBPoolExhausted
        expr: rate(sqlite_busy_timeouts_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SQLite busy timeouts detected"
          description: "SQLite is experiencing busy timeouts, indicating connection pool pressure."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 3.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend memory usage above 3.5 GB"
          description: "The backend process is using more than 3.5 GB of resident memory."

      - alert: DiskUsageHigh
        expr: app_data_disk_usage_ratio > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC disk usage above 80%"
          description: "The persistent volume mounted at /data is more than 80% full. Consider scaling or cleaning up old data."

      - alert: WALCheckpointFailing
        expr: rate(wal_checkpoint_failures_total[1h]) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "WAL checkpoint failures detected"
          description: "SQLite WAL checkpoint has been failing for 2+ hours. The .db-wal file may be growing. Check for long-held read transactions."

      - alert: LongReadTransaction
        expr: histogram_quantile(0.99, rate(db_read_tx_age_seconds_bucket[5m])) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Long read transactions detected"
          description: "99th percentile read transaction duration exceeds 30s. These block WAL truncation and cause disk bloat."

      - alert: BackgroundTaskStuck
        expr: bg_task_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Background task stuck for >5 minutes"
          description: "A background task has been running for over 300 seconds. It may be hung or leaking."

      - alert: VectorStoreOrphansGrowing
        expr: pending_vector_deletion_jobs{status="pending"} > 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Vector deletion backlog is growing"
          description: "More than 10 vector deletion jobs remain pending. Check Chroma and index-store connectivity."

      - alert: SupervisedTaskExhausted
        expr: increase(background_task_exhausted_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Background task max_restarts exhausted"
          description: "A supervised background task has exceeded its max_restarts and stopped permanently. Service is degraded until restart."

      - alert: PerEndpointP99LatencyHigh
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, path)) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint {{ $labels.path }} P99 latency above 5s"
          description: "The 99th percentile latency for endpoint {{ $labels.path }} has been above 5 seconds for 2 minutes."

      - alert: SSEHeartbeatStalled
        expr: rate(meeting_agent_sse_heartbeat_stalled_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SSE heartbeat stalls detected"
          description: "The streaming event bus is experiencing heartbeat stalls. Clients may perceive the stream as frozen."

      - alert: VectorDeletionDeadLetters
        expr: pending_vector_deletion_jobs{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vector deletion dead letters detected"
          description: "Some vector deletions have exceeded the max retry attempts and been moved to dead letter. Check Chroma/vector store connectivity and manual cleanup may be needed."

      - alert: DurableJobLeaseExpired
        expr: durable_job_expired_running > 0 and durable_job_oldest_expired_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Durable job worker lease expired"
          description: "At least one durable job has remained running with an expired lease for over 60 seconds. Check the embedded worker and dead-letter queue."

      - alert: NativeIndexRepairBacklog
        expr: index_repair_pending > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Native index repairs remain pending"
          description: "One or more ready files have a Chroma/BM25 generation or configuration mismatch. Check the durable file-processing queue."
