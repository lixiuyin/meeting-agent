global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: "meeting-agent-backend"
    metrics_path: "/metrics"
    scheme: http
    # Uncomment for production when PROMETHEUS_API_KEY is set. The backend
    # authenticates this endpoint with X-API-Key, not Authorization: Bearer.
    # http_headers:
    #   X-API-Key:
    #     files: [/run/secrets/prometheus_api_token]
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "meeting-agent"
          component: "backend"
