rule_files:
  - alerts.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'chat_completion_total{endpoint="/api/v1/chat/stream",outcome="success"}'
        values: '0+198x65'
      - series: 'chat_completion_total{endpoint="/api/v1/chat/stream",outcome="stream_error"}'
        values: '0+2x65'
    alert_rule_test:
      - eval_time: 60m
        alertname: ChatAvailabilityLow
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Chat availability below 99.5%"
              description: "Includes HTTP failures, terminal SSE errors, and incomplete responses."
  - interval: 1h
    input_series:
      - series: 'chat_completion_total{endpoint="/api/v1/chat",outcome="success"}'
        values: '0+200x25'
    promql_expr_test:
      - expr: meeting_agent:chat_availability:30d
        eval_time: 24h
        exp_samples:
          - labels: 'meeting_agent:chat_availability:30d'
            value: 1
  - interval: 1m
    input_series: []
    promql_expr_test:
      - expr: meeting_agent:chat_availability:30d
        eval_time: 1h
        exp_samples: []

  # A fast, high-volume synchronous route must not hide a slow SSE route.
  - interval: 1m
    input_series:
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat",le="3"}'
        values: '0+1000x65'
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat",le="5"}'
        values: '0+1000x65'
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat",le="+Inf"}'
        values: '0+1000x65'
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat/stream",le="3"}'
        values: '0+0x65'
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat/stream",le="5"}'
        values: '0+100x65'
      - series: 'chat_completion_duration_seconds_bucket{endpoint="/api/v1/chat/stream",le="+Inf"}'
        values: '0+100x65'
    alert_rule_test:
      - eval_time: 30m
        alertname: ChatLatencyP95High
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Chat endpoint latency P95 above 3s"
              description: "The full chat response latency has been above the 3-second P95 objective for 15 minutes."
    promql_expr_test:
      - expr: meeting_agent:chat_p95_seconds:30d
        eval_time: 30m
        exp_samples:
          - labels: 'meeting_agent:chat_p95_seconds:30d'
            value: 4.9
