server:
  http_listen_port: 9090
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: meeting-agent
    static_configs:
      - targets: [localhost]
        labels:
          service: meeting-agent-backend
          __path__: /var/log/meeting-agent/*.log
